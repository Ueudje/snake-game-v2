<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="A modern, responsive Snake game with Time Attack, a Daily Challenge, special foods, skins, themes and achievements. English and French." />
  <meta name="theme-color" content="#0f172a" />
  <title>Snake Game</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f172a'/%3E%3Crect x='4' y='13' width='7' height='7' rx='2' fill='%2355e6a5'/%3E%3Crect x='12.5' y='13' width='7' height='7' rx='2' fill='%2355e6a5'/%3E%3Crect x='21' y='13' width='7' height='7' rx='2' fill='%23a7f3d0'/%3E%3Ccircle cx='24.5' cy='7' r='3' fill='%23ff6b78'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css?v=4" />
</head>
<body>
  <main class="game-shell">
    <section class="game-card" aria-labelledby="game-title">
      <header class="game-header">
        <div>
          <p id="mode-label" class="eyebrow">CLASSIC ARCADE</p>
          <h1 id="game-title">Snake</h1>
        </div>
        <div class="scores" role="group" aria-label="Scores" data-i18n-aria="aria.scores">
          <div class="score-box"><span data-i18n="score.level">Level</span><strong id="level">1</strong></div>
          <div class="score-box"><span data-i18n="score.score">Score</span><strong id="score">0</strong></div>
          <div class="score-box"><span data-i18n="score.best">Best</span><strong id="best-score">0</strong></div>
        </div>
      </header>

      <div id="board-wrap" class="board-wrap">
        <div id="game-board" class="game-board" role="group" aria-label="Snake game board. Steer with the arrow keys or W A S D." data-i18n-aria="aria.board" tabindex="0">
          <div id="rock-layer" class="rock-layer" aria-hidden="true"></div>
          <div id="food" class="food" aria-hidden="true"></div>
          <div id="bonus" class="bonus" aria-hidden="true" hidden></div>
          <div id="snake-layer" class="snake-layer" data-skin="mint" aria-hidden="true"></div>
          <div id="food-effect" class="food-effect" aria-hidden="true"></div>
          <div id="float-layer" class="float-layer" aria-hidden="true"></div>
        </div>

        <div id="hud" class="hud" aria-hidden="true">
          <div id="effects" class="effects"></div>
          <div id="clock" class="clock" hidden>1:00</div>
        </div>
        <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
        <div id="countdown" class="countdown" aria-hidden="true" hidden></div>

        <div id="message-overlay" class="message-overlay" data-view="ready">
          <div class="message-card">
            <p id="message-kicker" class="eyebrow">READY?</p>
            <h2 id="message-title">Let's play</h2>
            <p id="message-text" class="message-text">Steer with arrow keys, WASD or swipes.</p>
            <p id="final-score" class="final-score" hidden>Final score: 0</p>
            <p id="stats-line" class="stats-line" hidden></p>
            <p id="unlock-line" class="unlock-line" hidden></p>
            <div class="only-ready only-over">
              <div id="mode-picker" class="chips" role="radiogroup" aria-label="Game mode" data-i18n-aria="aria.mode"></div>
              <p id="mode-hint" class="mode-hint"></p>
            </div>
            <div class="quick-row only-ready">
              <button id="quick-sound" class="chip-button" type="button" aria-pressed="true">Sound</button>
              <button id="quick-dpad" class="chip-button" type="button" aria-pressed="false">D-pad</button>
              <button id="quick-fullscreen" class="chip-button" type="button" aria-pressed="false" hidden>Full screen</button>
            </div>
            <div class="quick-row only-over">
              <button id="share-button" class="chip-button" type="button">Share result</button>
            </div>
            <p id="restart-hint" class="restart-hint" data-i18n="over.hint" hidden>Press Enter or an arrow key, or tap, to play again</p>
          </div>
        </div>

        <div id="menu" class="menu" role="dialog" aria-modal="true" aria-labelledby="menu-title" hidden>
          <div class="menu-head">
            <h2 id="menu-title" data-i18n="menu.title">Menu</h2>
            <button id="menu-close" class="button button-ghost button-icon" type="button" aria-label="Close menu" data-i18n-aria="btn.close">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
            </button>
          </div>
          <div id="menu-tabs" class="menu-tabs" role="tablist" aria-label="Menu sections" data-i18n-aria="aria.menuSections"></div>
          <div id="menu-body" class="menu-body" role="tabpanel" tabindex="0"></div>
        </div>
      </div>

      <div class="controls" role="group" aria-label="Game controls" data-i18n-aria="aria.controls">
        <button id="start-button" class="button button-primary" type="button">Start Game</button>
        <button id="pause-button" class="button" type="button" disabled>Pause</button>
        <button id="restart-button" class="button button-ghost" type="button" data-i18n="btn.restart">Restart</button>
        <button id="menu-button" class="button button-ghost button-icon" type="button" aria-label="Menu" data-i18n-aria="btn.menu" title="Style, trophies, stats and settings" data-i18n-title="btn.menuTip" aria-haspopup="dialog">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
        </button>
        <button id="fullscreen-button" class="button button-ghost button-icon" type="button" aria-label="Full screen" aria-pressed="false" title="Full screen" hidden>
          <svg class="icon-enter" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" /></svg>
          <svg class="icon-exit" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5" /></svg>
        </button>
      </div>

      <div id="dpad" class="dpad" role="group" aria-label="On-screen direction buttons" data-i18n-aria="aria.dpad">
        <button class="dpad-button dpad-up" type="button" data-dir="up" aria-label="Up" data-i18n-aria="aria.up">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6" /></svg>
        </button>
        <button class="dpad-button dpad-left" type="button" data-dir="left" aria-label="Left" data-i18n-aria="aria.left">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6" /></svg>
        </button>
        <button class="dpad-button dpad-down" type="button" data-dir="down" aria-label="Down" data-i18n-aria="aria.down">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6" /></svg>
        </button>
        <button class="dpad-button dpad-right" type="button" data-dir="right" aria-label="Right" data-i18n-aria="aria.right">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6" /></svg>
        </button>
      </div>

      <p class="help-text">
        <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> <span data-i18n="help.or">or</span>
        <kbd data-key="KeyW">W</kbd> <kbd data-key="KeyA">A</kbd> <kbd data-key="KeyS">S</kbd> <kbd data-key="KeyD">D</kbd> <span data-i18n="help.steer">to steer</span> ·
        <kbd data-i18n="key.space">Space</kbd> <span data-i18n="help.or">or</span> <kbd>P</kbd> <span data-i18n="help.pause">to pause</span> ·
        <kbd>M</kbd> <span data-i18n="help.mute">mutes</span> · <span data-i18n="help.swipe">Swipe or tap on mobile</span>
      </p>
      <p id="sr-status" class="sr-only" role="status" aria-live="polite"></p>
    </section>
  </main>

  <script src="js/script.js?v=4" defer></script>
</body>
</html>
